# OPTIONAL: only for high availability. router-peering runs fine standalone without this file.
#
# Copy to /etc/kolla/config/haproxy/services.d/router-peering.cfg, then run
#   kolla-ansible reconfigure -i <inventory> --tags haproxy
# Kolla renders this file with Jinja (ansible template), so the variables below are filled in.
# Edit the server list to the hosts that run the api container.
#
# REQUIRED before enabling this file: on every api host set `listen: "<that host's api_interface IP>:9797"`
# in router-peering.yaml. With the default wildcard ":9797", HAProxy cannot bind <VIP>:9797 on the same
# host and fails to start, taking every OpenStack API frontend down with it.
listen router_peering
  mode http
  bind {{ kolla_internal_vip_address }}:9797
  option httpchk GET /healthz
  http-check expect status 200
{% for host in groups['control'] %}
  server {{ hostvars[host]['ansible_facts']['hostname'] }} {{ 'api' | kolla_address(host) }}:9797 check inter 2000 rise 2 fall 5
{% endfor %}
